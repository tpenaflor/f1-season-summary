<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Season Summary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            color: #e10600;
        }
        .section {
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }
        .section:last-child {
            border-bottom: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>F1 Season Summary</h1>

        <div class="section" id="latest-race-results">
            <h2>Latest F1 Grand Prix Results</h2>
            <div class="loading">Loading latest race results...</div>
        </div>

        <div class="section" id="driver-standings">
            <h2>Current F1 Driver Standings</h2>
            <div class="loading">Loading driver standings...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchLatestRaceResults();
            fetchDriverStandings();
        });

        // IMPORTANT: Replace with your actual RapidAPI Key and Host.
        // For security in a real application, do not hardcode API keys in client-side code.
        // Use a backend proxy or environment variables.
        const RAPIDAPI_KEY = 'YOUR_RAPIDAPI_KEY'; // !!! REPLACE THIS !!!
        const RAPIDAPI_HOST = 'hyprace-api.p.rapidapi.com';
        const BASE_URL = `https://${RAPIDAPI_HOST}/v2`;

        const commonHeaders = {
            'x-rapidapi-key': RAPIDAPI_KEY,
            'x-rapidapi-host': RAPIDAPI_HOST
        };

        async function fetchLatestRaceResults() {
            const resultsSection = document.getElementById('latest-race-results');
            try {
                // Step 1: Get current Grands Prix to find the latest race
                const currentGrandsPrixResponse = await fetch(`${BASE_URL}/grands-prix?isCurrent=true`, { headers: commonHeaders });
                if (!currentGrandsPrixResponse.ok) {
                    throw new Error(`HTTP error! status: ${currentGrandsPrixResponse.status}`);
                }
                const currentGrandsPrixData = await currentGrandsPrixResponse.json();
                
                // Assuming the last item in the 'items' array is the most recent or relevant finished race
                // In a real scenario, you might need to sort by date or status
                const latestGrandPrix = currentGrandsPrixData.items[currentGrandsPrixData.items.length - 1];

                if (!latestGrandPrix) {
                    resultsSection.innerHTML = '<h2>Latest F1 Grand Prix Results</h2><p>No recent Grand Prix data available.</p>';
                    return;
                }

                const grandPrixId = latestGrandPrix.id;

                // Step 2: Get results for the latest Grand Prix
                const raceResultsResponse = await fetch(`${BASE_URL}/grands-prix/${grandPrixId}/results`, { headers: commonHeaders });
                if (!raceResultsResponse.ok) {
                    throw new Error(`HTTP error! status: ${raceResultsResponse.status}`);
                }
                const raceResultsData = await raceResultsResponse.json();
                const raceResults = raceResultsData.items;

                if (!raceResults || raceResults.length === 0) {
                    resultsSection.innerHTML = '<h2>Latest F1 Grand Prix Results</h2><p>No results found for the latest Grand Prix.</p>';
                    return;
                }

                // Race Name, Circuit Name, Date
                let html = `<h2>Latest F1 Grand Prix Results</h2>
                            <p><strong>Race:</strong> ${latestGrandPrix.name}</p>
                            <p><strong>Circuit ID (for reference):</strong> ${latestGrandPrix.circuitId}</p>
                            <p><strong>Date:</strong> ${new Date(latestGrandPrix.startDate).toLocaleDateString()}</p>`;

                // Winner
                const winner = raceResults.find(r => r.position === 1);
                if (winner) {
                    html += `<p><strong>Winner:</strong> ${winner.driver.firstName} ${winner.driver.lastName} (${winner.team.name})</p>`;
                }

                // Fastest Lap (assuming it's in the results for the winner or a specific entry)
                // This might need adjustment based on actual API response for fastest lap.
                // Assuming 'fastestLap' might be a property on the result item or need another call.
                // For now, let's assume it's part of the race result for a driver.
                // As the original Ergast API didn't have it directly, we'll look for it similarly.
                const fastestLapDriver = raceResults.find(r => r.fastestLap && r.fastestLap.rank === 1);
                if (fastestLapDriver) {
                    html += `<p><strong>Fastest Lap:</strong> ${fastestLapDriver.fastestLap.time} (${fastestLapDriver.driver.firstName} ${fastestLapDriver.driver.lastName})</p>`;
                } else {
                    html += `<p><strong>Fastest Lap:</strong> N/A (data structure unknown or not available)</p>`;
                }
                
                // Driver of the Day - usually a separate award, not typically in raw race results.
                html += `<p><strong>Driver of the Day:</strong> N/A (requires specific API endpoint or external data)</p>`;


                html += `<h3>Full Race Results</h3>
                         <table>
                             <thead>
                                 <tr>
                                     <th>Pos</th>
                                     <th>Driver</th>
                                     <th>Team</th>
                                     <th>Laps</th>
                                     <th>Time</th>
                                     <th>Points</th>
                                 </tr>
                             </thead>
                             <tbody>`;
                
                raceResults.forEach(result => {
                    html += `<tr>
                                 <td>${result.position}</td>
                                 <td>${result.driver.firstName} ${result.driver.lastName}</td>
                                 <td>${result.team.name}</td>
                                 <td>${result.laps}</td>
                                 <td>${result.time}</td>
                                 <td>${result.points}</td>
                             </tr>`;
                });
                html += `</tbody></table>`;

                // Top 3 Finishers
                const top3 = raceResults.slice(0, 3);
                if (top3.length > 0) {
                    html += `<h3>Top 3 Finishers</h3><ul>`;
                    top3.forEach(driver => {
                        html += `<li>${driver.position}. ${driver.driver.firstName} ${driver.driver.lastName} (${driver.team.name})</li>`;
                    });
                    html += `</ul>`;
                }
                
                resultsSection.innerHTML = html;

            } catch (error) {
                console.error('Error fetching latest race results:', error);
                resultsSection.innerHTML = `<h2>Latest F1 Grand Prix Results</h2><p>Failed to load race results: ${error.message}. Please ensure your RapidAPI key is set and valid.</p>`;
            }
        }

        async function fetchDriverStandings() {
            const standingsSection = document.getElementById('driver-standings');
            try {
                const response = await fetch(`${BASE_URL}/drivers-standings?isLastStanding=true`, { headers: commonHeaders });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const standings = data.items; // Assuming the standings are directly under 'items'

                if (!standings || standings.length === 0) {
                    standingsSection.innerHTML = '<h2>Current F1 Driver Standings</h2><p>No driver standings data available.</p>';
                    return;
                }

                let html = `<h2>Current F1 Driver Standings</h2>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Pos</th>
                                        <th>Driver</th>
                                        <th>Team</th>
                                        <th>Points</th>
                                        <th>Wins</th>
                                        <th>Podiums</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                
                standings.forEach(driver => {
                    // Assuming structure like { position, driver: { firstName, lastName }, team: { name }, points, wins, podiums }
                    html += `<tr>
                                 <td>${driver.position}</td>
                                 <td>${driver.driver.firstName} ${driver.driver.lastName}</td>
                                 <td>${driver.team.name}</td>
                                 <td>${driver.points}</td>
                                 <td>${driver.wins}</td>
                                 <td>${driver.podiums || 'N/A'}</td> <!-- Podiums might not be directly available, use N/A if so -->
                             </tr>`;
                });
                html += `</tbody></table>`;

                standingsSection.innerHTML = html;

            } catch (error) {
                console.error('Error fetching driver standings:', error);
                standingsSection.innerHTML = `<h2>Current F1 Driver Standings</h2><p>Failed to load driver standings: ${error.message}. Please ensure your RapidAPI key is set and valid.</p>`;
            }
        }
    </script>
</body>
</html>
