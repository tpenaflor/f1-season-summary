<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Season Summary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            color: #e10600;
        }
        .section {
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }
        .section:last-child {
            border-bottom: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>F1 Season Summary</h1>

        <div class="section" id="latest-race-results">
            <h2>Latest F1 Grand Prix Results</h2>
            <div class="loading">Loading latest race results...</div>
        </div>

        <div class="section" id="driver-standings">
            <h2>Current F1 Driver Standings</h2>
            <div class="loading">Loading driver standings...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchLatestRaceResults();
            fetchDriverStandings();
        });

        const BASE_URL = 'https://api.openf1.org/v1';

        async function fetchLatestRaceResults() {
            const resultsSection = document.getElementById('latest-race-results');
            try {
                // Get current year
                const currentYear = new Date().getFullYear();

                // Step 1: Get all meetings for the current year
                const meetingsResponse = await fetch(`${BASE_URL}/meetings?year=${currentYear}`);
                if (!meetingsResponse.ok) {
                    throw new Error(`HTTP error! status: ${meetingsResponse.status}`);
                }
                const allMeetings = await meetingsResponse.json();

                // Filter for past or current meetings and sort to find the latest one
                const now = new Date();
                const latestMeeting = allMeetings
                    .filter(m => new Date(m.date_end) <= now)
                    .sort((a, b) => new Date(b.date_end) - new Date(a.date_end))[0];

                if (!latestMeeting) {
                    resultsSection.innerHTML = '<h2>Latest F1 Grand Prix Results</h2><p>No recent Grand Prix data available for the current year.</p>';
                    return;
                }

                // Step 2: Get the Race session for the latest meeting
                const sessionsResponse = await fetch(`${BASE_URL}/sessions?meeting_key=${latestMeeting.meeting_key}&session_type=Race`);
                if (!sessionsResponse.ok) {
                    throw new Error(`HTTP error! status: ${sessionsResponse.status}`);
                }
                const raceSessions = await sessionsResponse.json();
                const raceSession = raceSessions[0]; // Assuming there's only one race session per meeting

                if (!raceSession) {
                    resultsSection.innerHTML = '<h2>Latest F1 Grand Prix Results</h2><p>No Race session found for the latest Grand Prix.</p>';
                    return;
                }

                // Step 3: Get session results for the race
                const sessionResultsResponse = await fetch(`${BASE_URL}/session_result?session_key=${raceSession.session_key}`);
                if (!sessionResultsResponse.ok) {
                    throw new Error(`HTTP error! status: ${sessionResultsResponse.status}`);
                }
                const raceResults = await sessionResultsResponse.json();

                if (!raceResults || raceResults.length === 0) {
                    resultsSection.innerHTML = '<h2>Latest F1 Grand Prix Results</h2><p>No results found for the latest Grand Prix.</p>';
                    return;
                }

                // Step 4: Get fastest lap data (this needs more specific filtering for a single lap)
                const lapsResponse = await fetch(`${BASE_URL}/laps?session_key=${raceSession.session_key}&is_fastest=true`);
                if (!lapsResponse.ok) {
                     // Log but don't throw, as fastest lap might not always be directly available this way
                    console.warn(`Could not fetch fastest lap for session_key ${raceSession.session_key}. Status: ${lapsResponse.status}`);
                }
                const fastestLaps = lapsResponse.ok ? await lapsResponse.json() : [];
                const fastestLap = fastestLaps.sort((a, b) => a.lap_duration - b.lap_duration)[0]; // Smallest duration is fastest

                // Extract necessary data
                const raceName = latestMeeting.meeting_name;
                const circuitName = latestMeeting.circuit_short_name;
                const raceDate = new Date(latestMeeting.date_start).toLocaleDateString();

                const winner = raceResults.find(r => r.position === 1);
                
                let html = `<h2>Latest F1 Grand Prix Results</h2>
                            <p><strong>Race:</strong> ${raceName}</p>
                            <p><strong>Circuit:</strong> ${circuitName}</p>
                            <p><strong>Date:</strong> ${raceDate}</p>`;

                if (winner) {
                    html += `<p><strong>Winner:</strong> ${winner.full_name} (${winner.team_name})</p>`;
                } else {
                    html += `<p><strong>Winner:</strong> N/A</p>`;
                }

                if (fastestLap) {
                    html += `<p><strong>Fastest Lap:</strong> ${fastestLap.lap_duration.toFixed(3)}s (Driver ID: ${fastestLap.driver_number})</p>`;
                } else {
                    html += `<p><strong>Fastest Lap:</strong> N/A</p>`;
                }
                
                // Top 3 Finishers
                const top3 = raceResults.slice(0, 3);
                if (top3.length > 0) {
                    html += `<h3>Top 3 Finishers</h3><ul>`;
                    top3.forEach(driver => {
                        html += `<li>${driver.position}. ${driver.full_name} (${driver.team_name})</li>`;
                    });
                    html += `</ul>`;
                }

                html += `<h3>Full Race Results</h3>
                         <table>
                             <thead>
                                 <tr>
                                     <th>Pos</th>
                                     <th>Driver</th>
                                     <th>Team</th>
                                     <th>Laps</th>
                                     <th>Time</th>
                                     <th>Points</th>
                                 </tr>
                             </thead>
                             <tbody>`;
                
                raceResults.forEach(result => {
                    html += `<tr>
                                 <td>${result.position_text}</td>
                                 <td>${result.full_name}</td>
                                 <td>${result.team_name}</td>
                                 <td>${result.laps}</td>
                                 <td>${result.time ? result.time : 'N/A'}</td>
                                 <td>${result.points}</td>
                             </tr>`;
                });
                html += `</tbody></table>`;
                
                resultsSection.innerHTML = html;

            } catch (error) {
                console.error('Error fetching latest race results:', error);
                resultsSection.innerHTML = `<h2>Latest F1 Grand Prix Results</h2><p>Failed to load race results: ${error.message}.</p>`;
            }
        }

        async function fetchDriverStandings() {
            const standingsSection = document.getElementById('driver-standings');
            try {
                const currentYear = new Date().getFullYear();
                const response = await fetch(`${BASE_URL}/championship_drivers?year=${currentYear}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const championshipDrivers = await response.json();

                // The API returns all entries, so we need to find the latest standing for each driver.
                // Assuming the last entry for each driver in the sorted list is the most recent.
                // Or, more robustly, filter by the maximum `date` or `meeting_key` if available.
                // OpenF1 API returns standings in order of meeting_key, so the highest meeting_key for each driver is the latest.

                const driverStandingsMap = new Map();
                championshipDrivers
                    .sort((a, b) => b.meeting_key - a.meeting_key) // Sort by meeting_key descending
                    .forEach(entry => {
                        if (!driverStandingsMap.has(entry.driver_number)) {
                            driverStandingsMap.set(entry.driver_number, entry);
                        }
                    });
                
                const standings = Array.from(driverStandingsMap.values())
                                    .sort((a, b) => a.position - b.position); // Sort by position for display

                if (!standings || standings.length === 0) {
                    standingsSection.innerHTML = '<h2>Current F1 Driver Standings</h2><p>No driver standings data available.</p>';
                    return;
                }

                let html = `<h2>Current F1 Driver Standings</h2>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Pos</th>
                                        <th>Driver</th>
                                        <th>Team</th>
                                        <th>Points</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                
                standings.forEach(driver => {
                    html += `<tr>
                                 <td>${driver.position}</td>
                                 <td>${driver.full_name}</td>
                                 <td>${driver.team_name}</td>
                                 <td>${driver.points}</td>
                             </tr>`;
                });
                html += `</tbody></table>`;
                
                standingsSection.innerHTML = html;

            } catch (error) {
                console.error('Error fetching driver standings:', error);
                standingsSection.innerHTML = `<h2>Current F1 Driver Standings</h2><p>Failed to load driver standings: ${error.message}.</p>`;
            }
        }
        }
    </script>
</body>
</html>
