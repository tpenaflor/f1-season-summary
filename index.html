<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Season Summary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            color: #e10600;
        }
        .section {
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }
        .section:last-child {
            border-bottom: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>F1 Season Summary</h1>

        <div class="section" id="latest-race-results">
            <h2>Latest F1 Grand Prix Results</h2>
            <div class="loading">Loading latest race results...</div>
        </div>

        <div class="section" id="driver-standings">
            <h2>Current F1 Driver Standings</h2>
            <div class="loading">Loading driver standings...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchLatestRaceResults();
            fetchDriverStandings();
        });

        const BASE_URL = 'http://api.jolpi.ca/ergast/f1'; // JOLPICA F1 Ergast-compatible API base URL

        async function fetchLatestRaceResults() {
            const resultsSection = document.getElementById('latest-race-results');
            try {
                // Ergast-compatible endpoint for the latest race results
                const response = await fetch(`${BASE_URL}/current/last/results.json`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const raceData = data.MRData.RaceTable.Races[0];

                if (!raceData) {
                    resultsSection.innerHTML = '<h2>Latest F1 Grand Prix Results</h2><p>No recent Grand Prix data available.</p>';
                    return;
                }

                const raceName = raceData.raceName;
                const circuitName = raceData.Circuit.circuitName;
                const raceDate = new Date(raceData.date).toLocaleDateString();
                const winner = raceData.Results.find(r => r.position === "1");

                let html = `<h2>Latest F1 Grand Prix Results</h2>
                            <p><strong>Race:</strong> ${raceName}</p>
                            <p><strong>Circuit:</strong> ${circuitName}</p>
                            <p><strong>Date:</strong> ${raceDate}</p>`;

                if (winner) {
                    html += `<p><strong>Winner:</strong> ${winner.Driver.givenName} ${winner.Driver.familyName} (${winner.Constructor.name})</p>`;
                } else {
                    html += `<p><strong>Winner:</strong> N/A</p>`;
                }

                // Ergast API does not directly provide 'fastest lap' in this endpoint in a simple field.
                // It's typically within individual lap data or not a top-level field for race results summary.
                // For simplicity, we will omit fastest lap for now or integrate if a clear path emerges.
                html += `<p><strong>Fastest Lap:</strong> N/A (Data not readily available in this endpoint)</p>`;

                // Top 3 Finishers
                const top3 = raceData.Results.slice(0, 3);
                if (top3.length > 0) {
                    html += `<h3>Top 3 Finishers</h3><ul>`;
                    top3.forEach(result => {
                        html += `<li>${result.position}. ${result.Driver.givenName} ${result.Driver.familyName} (${result.Constructor.name})</li>`;
                    });
                    html += `</ul>`;
                }

                html += `<h3>Full Race Results</h3>
                         <table>
                             <thead>
                                 <tr>
                                     <th>Pos</th>
                                     <th>Driver</th>
                                     <th>Team</th>
                                     <th>Laps</th>
                                     <th>Time</th>
                                     <th>Points</th>
                                 </tr>
                             </thead>
                             <tbody>`;

                raceData.Results.forEach(result => {
                    html += `<tr>
                                 <td>${result.position}</td>
                                 <td>${result.Driver.givenName} ${result.Driver.familyName}</td>
                                 <td>${result.Constructor.name}</td>
                                 <td>${result.laps}</td>
                                 <td>${result.Time ? result.Time.time : 'N/A'}</td>
                                 <td>${result.points}</td>
                             </tr>`;
                });
                html += `</tbody></table>`;

                resultsSection.innerHTML = html;

            } catch (error) {
                console.error('Error fetching latest race results:', error);
                resultsSection.innerHTML = `<h2>Latest F1 Grand Prix Results</h2><p>Failed to load race results: ${error.message}.</p>`;
            }
        }

        async function fetchDriverStandings() {
            const standingsSection = document.getElementById('driver-standings');
            try {
                // Ergast-compatible endpoint for current driver standings
                const response = await fetch(`${BASE_URL}/current/driverStandings.json`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const driverStandings = data.MRData.StandingsTable.StandingsLists[0].DriverStandings;

                if (!driverStandings || driverStandings.length === 0) {
                    standingsSection.innerHTML = '<h2>Current F1 Driver Standings</h2><p>No driver standings data available.</p>';
                    return;
                }

                let html = `<h2>Current F1 Driver Standings</h2>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Pos</th>
                                        <th>Driver</th>
                                        <th>Team</th>
                                        <th>Points</th>
                                    </tr>
                                </thead>
                                <tbody>`;

                driverStandings.forEach(standing => {
                    html += `<tr>
                                 <td>${standing.position}</td>
                                 <td>${standing.Driver.givenName} ${standing.Driver.familyName}</td>
                                 <td>${standing.Constructors[0].name}</td>
                                 <td>${standing.points}</td>
                             </tr>`;
                });
                html += `</tbody></table>`;

                standingsSection.innerHTML = html;

            } catch (error) {
                console.error('Error fetching driver standings:', error);
                standingsSection.innerHTML = `<h2>Current F1 Driver Standings</h2><p>Failed to load driver standings: ${error.message}.</p>`;
            }
        }
    </script>
</body>
</html>
