<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Season Summary</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            color: #e10600;
        }
        .section {
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }
        .section:last-child {
            border-bottom: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>F1 Season Summary</h1>

        <div class="section" id="latest-race-results">
            <h2>Latest F1 Grand Prix Results</h2>
            <div class="loading">Loading latest race results...</div>
        </div>

        <div class="section" id="driver-standings">
            <h2>Current F1 Driver Standings</h2>
            <div class="loading">Loading driver standings...</div>
        </div>

        <div class="section" id="historical-driver-standings">
            <h2>Historical Driver Standings Over Season</h2>
            <div class="season-selector">
                <label for="season-select">Select Season:</label>
                <select id="season-select"></select>
            </div>
            <canvas id="driverStandingsChart"></canvas>
            <div class="loading">Loading historical driver standings...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchLatestRaceResults();
            fetchDriverStandings();
            setupHistoricalDriverStandings();
        });

        const BASE_URL = 'https://api.jolpi.ca/ergast/f1'; // JOLPICA F1 Ergast-compatible API base URL (HTTPS)

        async function fetchLatestRaceResults() {
            const resultsSection = document.getElementById('latest-race-results');
            try {
                // Ergast-compatible endpoint for the latest race results
                const response = await fetch(`${BASE_URL}/current/last/results.json`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const raceData = data.MRData.RaceTable.Races[0];

                if (!raceData) {
                    resultsSection.innerHTML = '<h2>Latest F1 Grand Prix Results</h2><p>No recent Grand Prix data available.</p>';
                    return;
                }

                const raceName = raceData.raceName;
                const circuitName = raceData.Circuit.circuitName;
                const raceDate = new Date(raceData.date).toLocaleDateString();
                const winner = raceData.Results.find(r => r.position === "1");

                let html = `<h2>Latest F1 Grand Prix Results</h2>
                            <p><strong>Race:</strong> ${raceName}</p>
                            <p><strong>Circuit:</strong> ${circuitName}</p>
                            <p><strong>Date:</strong> ${raceDate}</p>`;

                if (winner) {
                    html += `<p><strong>Winner:</strong> ${winner.Driver.givenName} ${winner.Driver.familyName} (${winner.Constructor.name})</p>`;
                } else {
                    html += `<p><strong>Winner:</strong> N/A</p>`;
                }

                // Ergast API does not directly provide 'fastest lap' in this endpoint in a simple field.
                // It's typically within individual lap data or not a top-level field for race results summary.
                // For simplicity, we will omit fastest lap for now or integrate if a clear path emerges.
                html += `<p><strong>Fastest Lap:</strong> N/A (Data not readily available in this endpoint)</p>`;

                // Top 3 Finishers
                const top3 = raceData.Results.slice(0, 3);
                if (top3.length > 0) {
                    html += `<h3>Top 3 Finishers</h3><ul>`;
                    top3.forEach(result => {
                        html += `<li>${result.position}. ${result.Driver.givenName} ${result.Driver.familyName} (${result.Constructor.name})</li>`;
                    });
                    html += `</ul>`;
                }

                html += `<h3>Full Race Results</h3>
                         <table>
                             <thead>
                                 <tr>
                                     <th>Pos</th>
                                     <th>Driver</th>
                                     <th>Team</th>
                                     <th>Laps</th>
                                     <th>Time</th>
                                     <th>Points</th>
                                 </tr>
                             </thead>
                             <tbody>`;

                raceData.Results.forEach(result => {
                    html += `<tr>
                                 <td>${result.position}</td>
                                 <td>${result.Driver.givenName} ${result.Driver.familyName}</td>
                                 <td>${result.Constructor.name}</td>
                                 <td>${result.laps}</td>
                                 <td>${result.Time ? result.Time.time : 'N/A'}</td>
                                 <td>${result.points}</td>
                             </tr>`;
                });
                html += `</tbody></table>`;

                resultsSection.innerHTML = html;

            } catch (error) {
                console.error('Error fetching latest race results:', error);
                resultsSection.innerHTML = `<h2>Latest F1 Grand Prix Results</h2><p>Failed to load race results: ${error.message}.</p>`;
            }
        }

        async function fetchDriverStandings() {
            const standingsSection = document.getElementById('driver-standings');
            try {
                // Ergast-compatible endpoint for current driver standings
                const response = await fetch(`${BASE_URL}/current/driverStandings.json`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const driverStandings = data.MRData.StandingsTable.StandingsLists[0].DriverStandings;

                if (!driverStandings || driverStandings.length === 0) {
                    standingsSection.innerHTML = '<h2>Current F1 Driver Standings</h2><p>No driver standings data available.</p>';
                    return;
                }

                let html = `<h2>Current F1 Driver Standings</h2>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Pos</th>
                                        <th>Driver</th>
                                        <th>Team</th>
                                        <th>Points</th>
                                    </tr>
                                </thead>
                                <tbody>`;

                driverStandings.forEach(standing => {
                    html += `<tr>
                                 <td>${standing.position}</td>
                                 <td>${standing.Driver.givenName} ${standing.Driver.familyName}</td>
                                 <td>${standing.Constructors[0].name}</td>
                                 <td>${standing.points}</td>
                             </tr>`;
                });
                html += `</tbody></table>`;

                standingsSection.innerHTML = html;

            } catch (error) {
                console.error('Error fetching driver standings:', error);
                standingsSection.innerHTML = `<h2>Current F1 Driver Standings</h2><p>Failed to load driver standings: ${error.message}.</p>`;
            }
        }

        let driverStandingsChartInstance = null; // To store the Chart.js instance

        async function setupHistoricalDriverStandings() {
            const seasonSelect = document.getElementById('season-select');
            const currentYear = new Date().getFullYear();

            // Populate season dropdown with a range of years
            for (let year = currentYear; year >= 1950; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (year === currentYear) { // Set current year as default selected
                    option.selected = true;
                }
                seasonSelect.appendChild(option);
            }

            // Event listener for season change
            seasonSelect.addEventListener('change', (event) => {
                fetchAndPlotHistoricalDriverStandings(event.target.value);
            });

            // Initial plot for the current year
            fetchAndPlotHistoricalDriverStandings(currentYear);
        }

        async function fetchAndPlotHistoricalDriverStandings(season) {
            const loadingDiv = document.querySelector('#historical-driver-standings .loading');
            const chartCanvas = document.getElementById('driverStandingsChart');
            loadingDiv.style.display = 'block'; // Show loading indicator
            chartCanvas.style.display = 'none'; // Hide chart while loading

            try {
                // Fetch all races for the selected season to determine the number of rounds
                const racesResponse = await fetch(`${BASE_URL}/${season}/results.json`);
                if (!racesResponse.ok) {
                    throw new Error(`HTTP error! status: ${racesResponse.status}`);
                }
                const racesData = await racesResponse.json();
                const numRounds = racesData.MRData.RaceTable.Races.length;

                if (numRounds === 0) {
                    loadingDiv.textContent = `No race data available for ${season}.`;
                    return;
                }

                const driverPointsData = {}; // Stores {driverId: {round: points}}
                const roundsLabels = [];

                for (let round = 1; round <= numRounds; round++) {
                    roundsLabels.push(`R${round}`);
                    const standingsResponse = await fetch(`${BASE_URL}/${season}/${round}/driverStandings.json`);
                    if (!standingsResponse.ok) {
                        console.warn(`Could not fetch standings for ${season} round ${round}. Status: ${standingsResponse.status}`);
                        continue; // Skip this round if data is unavailable
                    }
                    const standingsData = await standingsResponse.json();
                    const driverStandings = standingsData.MRData.StandingsTable.StandingsLists[0].DriverStandings;

                    if (driverStandings) {
                        driverStandings.forEach(standing => {
                            const driverId = standing.Driver.driverId;
                            const points = parseInt(standing.points);
                            
                            if (!driverPointsData[driverId]) {
                                driverPointsData[driverId] = {name: `${standing.Driver.givenName} ${standing.Driver.familyName}`, points: []};
                            }
                            // Ensure points array is aligned with roundsLabels
                            while (driverPointsData[driverId].points.length < round - 1) {
                                driverPointsData[driverId].points.push(null); // Fill missing rounds with null
                            }
                            driverPointsData[driverId].points.push(points);
                        });
                    }
                }

                // Normalize data: ensure all drivers have data for all rounds (fill with previous value or 0)
                const allDriverIds = Object.keys(driverPointsData);
                allDriverIds.forEach(driverId => {
                    while (driverPointsData[driverId].points.length < numRounds) {
                        const lastKnownPoints = driverPointsData[driverId].points.length > 0 ? driverPointsData[driverId].points[driverPointsData[driverId].points.length - 1] : 0;
                        driverPointsData[driverId].points.push(lastKnownPoints);
                    }
                });

                const datasets = allDriverIds.map(driverId => ({
                    label: driverPointsData[driverId].name,
                    data: driverPointsData[driverId].points,
                    borderColor: getRandomColor(), // Helper function for random color
                    fill: false,
                    tension: 0.1
                }));

                if (driverStandingsChartInstance) {
                    driverStandingsChartInstance.destroy(); // Destroy previous chart instance
                }

                const ctx = chartCanvas.getContext('2d');
                driverStandingsChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: roundsLabels,
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: `Driver Standings Progression - ${season}`
                            },
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: 'Round'
                                }
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: 'Points'
                                },
                                beginAtZero: true
                            }
                        }
                    }
                });

                loadingDiv.style.display = 'none'; // Hide loading indicator
                chartCanvas.style.display = 'block'; // Show chart

            } catch (error) {
                console.error('Error fetching historical driver standings:', error);
                loadingDiv.textContent = `Failed to load historical standings for ${season}: ${error.message}.`;
                loadingDiv.style.display = 'block';
                chartCanvas.style.display = 'none';
            }
        }

        // Helper function to generate a random color for chart lines
        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

    </script>
</body>
</html>
