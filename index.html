<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Season Summary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            color: #e10600;
        }
        .section {
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }
        .section:last-child {
            border-bottom: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>F1 Season Summary</h1>

        <div class="section" id="latest-race-results">
            <h2>Latest F1 Grand Prix Results</h2>
            <div class="loading">Loading latest race results...</div>
        </div>

        <div class="section" id="driver-standings">
            <h2>Current F1 Driver Standings</h2>
            <div class="loading">Loading driver standings...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchLatestRaceResults();
            fetchDriverStandings();
        });

        async function fetchLatestRaceResults() {
            const resultsSection = document.getElementById('latest-race-results');
            try {
                const response = await fetch('https://ergast.com/api/f1/current/last/results');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const race = data.MRData.RaceTable.Races[0];

                if (!race) {
                    resultsSection.innerHTML = '<h2>Latest F1 Grand Prix Results</h2><p>No recent race data available.</p>';
                    return;
                }

                let html = `<h2>Latest F1 Grand Prix Results</h2>
                            <p><strong>Race:</strong> ${race.raceName}</p>
                            <p><strong>Circuit:</strong> ${race.Circuit.circuitName}, ${race.Circuit.Location.locality}, ${race.Circuit.Location.country}</p>
                            <p><strong>Date:</strong> ${race.date}</p>`;

                const winner = race.Results.find(r => r.position === "1");
                if (winner) {
                    html += `<p><strong>Winner:</strong> ${winner.Driver.givenName} ${winner.Driver.familyName} (${winner.Constructor.name})</p>`;
                }

                html += `<h3>Full Race Results</h3>
                         <table>
                             <thead>
                                 <tr>
                                     <th>Pos</th>
                                     <th>Driver</th>
                                     <th>Team</th>
                                     <th>Laps</th>
                                     <th>Time</th>
                                     <th>Points</th>
                                 </tr>
                             </thead>
                             <tbody>`;
                
                race.Results.forEach(result => {
                    html += `<tr>
                                 <td>${result.position}</td>
                                 <td>${result.Driver.givenName} ${result.Driver.familyName}</td>
                                 <td>${result.Constructor.name}</td>
                                 <td>${result.laps}</td>
                                 <td>${result.Time ? result.Time.time : 'N/A'}</td>
                                 <td>${result.points}</td>
                             </tr>`;
                });
                html += `</tbody></table>`;

                // Fastest Lap and Driver of the Day are not directly available in this API response format without additional parsing or different endpoints.
                // For now, we'll indicate if they were requested.
                // To get "Top 3 Finishers" we can filter the results.
                const top3 = race.Results.slice(0, 3);
                if (top3.length > 0) {
                    html += `<h3>Top 3 Finishers</h3><ul>`;
                    top3.forEach(driver => {
                        html += `<li>${driver.position}. ${driver.Driver.givenName} ${driver.Driver.familyName} (${driver.Constructor.name})</li>`;
                    });
                    html += `</ul>`;
                }


                resultsSection.innerHTML = html;

            } catch (error) {
                console.error('Error fetching latest race results:', error);
                resultsSection.innerHTML = `<h2>Latest F1 Grand Prix Results</h2><p>Failed to load race results: ${error.message}. Please try again later.</p>`;
            }
        }

        async function fetchDriverStandings() {
            const standingsSection = document.getElementById('driver-standings');
            try {
                const response = await fetch('https://ergast.com/api/f1/current/driverStandings');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const standings = data.MRData.StandingsTable.StandingsLists[0].DriverStandings;

                if (!standings || standings.length === 0) {
                    standingsSection.innerHTML = '<h2>Current F1 Driver Standings</h2><p>No driver standings data available.</p>';
                    return;
                }

                let html = `<h2>Current F1 Driver Standings</h2>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Pos</th>
                                        <th>Driver</th>
                                        <th>Team</th>
                                        <th>Points</th>
                                        <th>Wins</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                
                standings.forEach(driver => {
                    html += `<tr>
                                 <td>${driver.position}</td>
                                 <td>${driver.Driver.givenName} ${driver.Driver.familyName}</td>
                                 <td>${driver.Constructors[0].name}</td>
                                 <td>${driver.points}</td>
                                 <td>${driver.wins}</td>
                             </tr>`;
                });
                html += `</tbody></table>`;

                standingsSection.innerHTML = html;

            } catch (error) {
                console.error('Error fetching driver standings:', error);
                standingsSection.innerHTML = `<h2>Current F1 Driver Standings</h2><p>Failed to load driver standings: ${error.message}. Please try again later.</p>`;
            }
        }
    </script>
</body>
</html>
